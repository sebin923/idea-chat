# =====================================================================
# Nginx 설정 - 웹 서버이자 "교통정리" 역할
#   - /        요청 → 화면 파일(index.html, style.css, app.js)을 직접 돌려줌
#   - /api/... 요청 → 뒤에 있는 Flask 컨테이너(backend:5000)로 전달
# =====================================================================

server {
    # 컨테이너 안에서 80번 포트로 요청을 받음
    # (호스트의 8080 → 컨테이너 80 연결은 docker-compose.yml 에서 설정)
    listen 80;

    # 화면(정적 파일) 처리
    location / {
        root  /usr/share/nginx/html;   # 화면 파일이 들어 있는 폴더
        index index.html;              # 주소만 치고 들어오면 index.html 을 보여줌
    }

    # API 요청은 Flask 로 넘기기
    location /api/ {
        # "backend" 는 docker-compose.yml 의 서비스 이름 = Compose 안에서의 주소
        proxy_pass http://backend:5000;

        # 원래 요청 정보(접속 주소, 사용자 IP)를 Flask 쪽에 같이 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
