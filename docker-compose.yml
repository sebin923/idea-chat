# =====================================================================
# Docker Compose - 컨테이너 3개를 한 번에 실행
#   브라우저 → 호스트 :8080 → nginx :80 → backend(Flask) :5000 → redis :6379
# 실행: docker compose up -d --build
# 종료: docker compose down
# =====================================================================

services:

  # ---------------------------------------------------------------
  # 1) nginx : 화면 제공 + /api/ 요청을 backend 로 전달
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine           # 이미 만들어진 공식 Nginx 이미지 사용
    ports:
      - "8080:80"                      # "호스트 8080" ↔ "컨테이너 80" 연결
    volumes:
      # 내 컴퓨터(EC2) 폴더를 컨테이너 안으로 연결 (:ro = 읽기 전용)
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend                        # backend 를 먼저 띄운 뒤 nginx 시작
    restart: unless-stopped            # 컨테이너가 죽거나 서버 재부팅 시 자동 재시작

  # ---------------------------------------------------------------
  # 2) backend : Flask API 서버 (backend/Dockerfile 로 이미지 빌드)
  # ---------------------------------------------------------------
  backend:
    build: ./backend
    environment:
      REDIS_HOST: redis                # app.py 가 이 값으로 Redis 주소를 찾음
      REDIS_PORT: "6379"
    depends_on:
      - redis
    restart: unless-stopped
    # ports 를 열지 않음 → 외부에서 5000 으로 직접 접근 불가, nginx 를 통해서만 접근

  # ---------------------------------------------------------------
  # 3) redis : 채팅방·메시지를 저장하는 공용 저장소
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # 데이터를 파일에도 기록(재시작해도 유지)
    volumes:
      - redis-data:/data               # 아래 이름 있는 볼륨에 데이터 저장
    restart: unless-stopped

# 컨테이너를 지웠다 다시 만들어도 Redis 데이터가 남도록 하는 저장 공간
volumes:
  redis-data:
